name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            chore
            test
            ci
          subjectPattern: '^(?![A-Z])(?!.*#)(?!.*\.$).+$'
          subjectPatternError: |
            La description « {subject} » du titre « {title} » ne respecte pas
            la convention : minuscule au début, pas de numéro d'issue, pas de
            point final.
